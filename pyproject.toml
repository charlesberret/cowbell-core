[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cowbell"
dynamic = ["version"]
description = "pick an agent for this directory: running, resume, or new"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Charles Berret" }]
dependencies = []
classifiers = [
  "Environment :: Console :: Curses",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/charlesberret/cowbell-core"
Issues = "https://github.com/charlesberret/cowbell-core/issues"

[project.scripts]
cowbell = "cowbell_boot:cli"

[tool.hatch.version]
path = "cowbell.py"

[tool.hatch.build.targets.wheel]
only-include = ["cowbell.py", "cowbell_boot.py"]

[tool.hatch.build.targets.wheel.shared-data]
"harnesses.toml" = "share/cowbell/harnesses.toml"

[tool.hatch.build.targets.sdist]
only-include = ["cowbell.py", "cowbell_boot.py", "harnesses.toml", "README.md", "LICENSE"]
